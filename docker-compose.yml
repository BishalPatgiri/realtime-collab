# Local development dependencies. Brings up Redis so the server can run in its
# horizontally-scalable mode:
#
#   docker compose up -d
#   REDIS_URL=redis://localhost:6379 npm run dev
#
# Full multi-instance deployment (several servers behind a load balancer) is
# added in a later stage.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
